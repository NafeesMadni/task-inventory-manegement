<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devices | Device Portal</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>

<body>

    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="brand">
                <span class="brand-logo">D</span>
                <span>Device Portal</span>
            </a>

            <nav class="site-nav">
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/devices" class="nav-link active">Devices</a>
            </nav>

            <div class="header-right">
                <div class="user-chip">
                    <span class="avatar sm" id="user-avatar">·</span>
                    <span class="user-name" id="user-info">Loading...</span>
                </div>
                <button class="btn" id="logout-btn">Logout</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="page-note" id="page-message">Loading...</div>

        <section id="devices-panel" class="hidden">
            <div class="panel-heading">
                <div>
                    <p class="eyebrow">Inventory</p>
                    <h1>Devices <span class="role-badge" id="title-badge"></span></h1>
                    <p class="subtitle">Every device in the inventory, with its status and condition.</p>
                </div>
                <button class="btn btn-primary" id="refresh-btn">Refresh</button>
            </div>

            <div class="stats" id="stats"></div>

            <div class="card">
                <div class="toolbar">
                    <div class="field grow">
                        <label for="filter-search">Search</label>
                        <input type="text" id="filter-search" placeholder="Name, brand, processor or ID">
                    </div>

                    <div class="field">
                        <label for="filter-status">Status</label>
                        <select id="filter-status">
                            <option value="">All statuses</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="filter-condition">Condition</label>
                        <select id="filter-condition">
                            <option value="">All conditions</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="sort-by">Sort by</label>
                        <select id="sort-by">
                            <option value="name">Name (A–Z)</option>
                            <option value="brand">Brand (A–Z)</option>
                            <option value="ram">RAM (high to low)</option>
                            <option value="issued">Recently issued</option>
                        </select>
                    </div>

                    <button class="btn" id="clear-filters">Clear</button>
                </div>

                <div class="toolbar">
                    <span class="count" style="margin-left:0" id="result-count">0 devices</span>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Device</th>
                                <th>Specs</th>
                                <th>Status</th>
                                <th>Condition</th>
                                <th>Issued</th>
                                <th>ID</th>
                            </tr>
                        </thead>
                        <tbody id="devices-table"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div class="toast" id="toast" role="status"></div>

    <script>
        const API = "/api/v1";
        const SITE = "Device Portal";
        const $ = id => document.getElementById(id);

        let role = "pending";
        let allDevices = [];   // whole fleet, used for the stat cards
        let results = [];      // result of the latest server-side search
        let options = { statuses: [], conditions: [] };

        /* ---------- Helpers ---------- */

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
            })[char]);
        }

        const pretty = value => String(value ?? "").replace(/_/g, " ").toLowerCase();

        function formatDate(value) {
            const date = new Date(value);
            return !value || Number.isNaN(date.getTime()) ? null : date.toLocaleDateString();
        }

        let toastTimer;
        function toast(message, type = "success") {
            const el = $("toast");
            el.textContent = message;
            el.className = `toast show ${type === "error" ? "error" : ""}`;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
        }

        function statusTone(value) {
            const v = pretty(value);
            if (v.includes("avail")) return "ok";
            if (v.includes("reserv") || v.includes("assign") || v.includes("issue")) return "info";
            if (v.includes("repair")) return "warn";
            if (v.includes("retire") || v.includes("lost") || v.includes("damag")) return "bad";
            return "neutral";
        }

        function conditionTone(value) {
            const v = pretty(value);
            if (v.includes("new") || v.includes("good") || v.includes("excellent")) return "ok";
            if (v.includes("fair") || v.includes("used")) return "warn";
            if (v.includes("poor") || v.includes("bad") || v.includes("damag") || v.includes("broken")) return "bad";
            return "neutral";
        }

        function tableMessage(text, isError = false) {
            $("devices-table").innerHTML =
                `<tr><td colspan="6" class="page-note ${isError ? "error" : ""}">${escapeHTML(text)}</td></tr>`;
        }

        // Returns the response, or null after sending an unauthenticated user to sign in.
        async function api(path, options = {}) {
            const response = await fetch(`${API}${path}`, { credentials: "include", ...options });
            if (response.status === 401) {
                window.location.replace("/signin");
                return null;
            }
            return response;
        }

        /* ---------- Init ---------- */

        async function init() {
            try {
                const response = await api("/user/me");
                if (!response) return;
                if (!response.ok) throw new Error("Unable to verify your account.");

                const user = await response.json();
                role = String(user.role || "pending").toLowerCase();
                renderUser(user);

                document.title = `Devices · ${role} | ${SITE}`;

                if (role !== "admin") {
                    $("page-message").innerHTML =
                        `Only admins can view all devices. You're signed in as ` +
                        `<span class="role-badge ${escapeHTML(role)}">${escapeHTML(role)}</span>.`;
                    return;
                }

                $("page-message").classList.add("hidden");
                $("devices-panel").classList.remove("hidden");
                bindEvents();
                await refresh();

            } catch (error) {
                $("page-message").textContent = error.message;
                $("page-message").classList.add("error");
            }
        }

        function renderUser(user) {
            const first = user.first_name || "";
            const last = user.last_name || "";

            $("user-info").innerHTML =
                `${escapeHTML(`${first} ${last}`.trim())} ` +
                `<span class="role-badge ${escapeHTML(role)}">${escapeHTML(role)}</span>`;
            $("user-avatar").textContent = `${first[0] || ""}${last[0] || ""}`.toUpperCase() || "·";

            const badge = $("title-badge");
            badge.textContent = role;
            badge.classList.add(role);
        }

        function bindEvents() {
            $("logout-btn").addEventListener("click", logout);
            $("refresh-btn").addEventListener("click", refresh);

            // Status / condition are searched on the server; text search and sorting happen locally.
            $("filter-status").addEventListener("change", runSearch);
            $("filter-condition").addEventListener("change", runSearch);
            $("filter-search").addEventListener("input", renderTable);
            $("sort-by").addEventListener("change", renderTable);

            $("clear-filters").addEventListener("click", () => {
                $("filter-search").value = "";
                $("filter-status").value = "";
                $("filter-condition").value = "";
                runSearch();
            });
        }

        async function logout() {
            try {
                const response = await api("/user/logout", { method: "POST" });
                if (!response) return;
                if (!response.ok) {
                    const result = await response.json().catch(() => ({}));
                    throw new Error(result.message || "Logout failed.");
                }
                window.location.replace("/signin");
            } catch (error) {
                toast(error.message || "Unable to logout.", "error");
            }
        }

        /* ---------- Data ---------- */

        async function fetchDevices(filters) {
            const response = await api("/device/search", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(filters),
            });
            if (!response) return null;
            if (response.status === 403) throw new Error("You are not authorized to view devices.");
            if (!response.ok) throw new Error("Unable to load devices.");
            return response.json();
        }

        async function refresh() {
            tableMessage("Loading devices...");

            try {
                const optionsResponse = await api("/device/options");
                if (!optionsResponse) return;
                if (optionsResponse.ok) {
                    options = await optionsResponse.json();
                    populateSelect("filter-status", options.statuses, "All statuses");
                    populateSelect("filter-condition", options.conditions, "All conditions");
                }

                const all = await fetchDevices({});
                if (!all) return;
                allDevices = all;

                renderStats();
                await runSearch();

            } catch (error) {
                tableMessage(error.message, true);
            }
        }

        function populateSelect(id, values, allLabel) {
            const select = $(id);
            const selected = select.value;

            select.innerHTML = `<option value="">${allLabel}</option>` +
                values.map(v =>
                    `<option value="${escapeHTML(v)}">${escapeHTML(pretty(v))}</option>`).join("");

            if (values.includes(selected)) select.value = selected;
        }

        async function runSearch() {
            const filters = {};
            if ($("filter-status").value) filters.status = $("filter-status").value;
            if ($("filter-condition").value) filters.condition = $("filter-condition").value;

            try {
                // No server-side filters: reuse the full list instead of asking again.
                results = Object.keys(filters).length ? await fetchDevices(filters) : allDevices;
                if (results === null) return;
                renderTable();

            } catch (error) {
                tableMessage(error.message, true);
            }
        }

        /* ---------- Rendering ---------- */

        function renderStats() {
            const cards = [`<div class="stat-card"><p>Total devices</p><h2>${allDevices.length}</h2></div>`];

            options.statuses.forEach(status => {
                const count = allDevices.filter(d => String(d.status) === String(status)).length;
                cards.push(
                    `<div class="stat-card"><p style="text-transform:capitalize">${escapeHTML(pretty(status))}</p>` +
                    `<h2>${count}</h2></div>`);
            });

            $("stats").innerHTML = cards.join("");
        }

        function sortDevices(list) {
            const by = $("sort-by").value;
            const text = (a, b) => String(a ?? "").localeCompare(String(b ?? ""), undefined, { sensitivity: "base" });

            return [...list].sort((a, b) => {
                if (by === "brand") return text(a.brand, b.brand) || text(a.name, b.name);
                if (by === "ram") return (b.ram_gb - a.ram_gb) || text(a.name, b.name);
                if (by === "issued") {
                    const ta = a.issued_at ? new Date(a.issued_at).getTime() : -Infinity;
                    const tb = b.issued_at ? new Date(b.issued_at).getTime() : -Infinity;
                    return tb - ta;
                }
                return text(a.name, b.name);
            });
        }

        function renderTable() {
            const search = $("filter-search").value.trim().toLowerCase();

            const visible = sortDevices(results.filter(d =>
                !search || [d.id, d.name, d.brand, d.processor, pretty(d.status), pretty(d.condition)]
                    .join(" ").toLowerCase().includes(search)));

            $("result-count").textContent = visible.length === allDevices.length
                ? `${visible.length} devices`
                : `${visible.length} of ${allDevices.length} devices`;

            if (!visible.length) {
                tableMessage("No devices match your search.");
                return;
            }

            $("devices-table").innerHTML = visible.map(device => {
                const specs = [
                    device.ram_gb ? `${device.ram_gb} GB RAM` : "",
                    device.ssd_gb ? `${device.ssd_gb} GB SSD` : "",
                    device.hdd_gb ? `${device.hdd_gb} GB HDD` : "",
                ].filter(Boolean).map(s => `<span class="spec">${s}</span>`).join("");

                const issued = formatDate(device.issued_at);

                return `
                <tr>
                    <td>
                        <div class="device-name">${escapeHTML(device.name)}</div>
                        <div class="device-sub">${escapeHTML(device.brand)}</div>
                    </td>
                    <td>
                        <div class="device-sub" style="margin:0 0 6px">${escapeHTML(device.processor)}</div>
                        <div class="spec-list">${specs}</div>
                    </td>
                    <td><span class="pill ${statusTone(device.status)}">${escapeHTML(pretty(device.status))}</span></td>
                    <td><span class="pill ${conditionTone(device.condition)}">${escapeHTML(pretty(device.condition))}</span></td>
                    <td class="${issued ? "" : "muted"}">${issued ?? "Not issued"}</td>
                    <td class="muted">#${escapeHTML(device.id)}</td>
                </tr>`;
            }).join("");
        }

        init();
    </script>

</body>

</html>
