<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify sign in | Device Portal</title>
    <link rel="stylesheet" href="/static/css/app.css?v=20261117a">
    <script src="/static/js/twofa-verify.js" defer></script>
</head>

<body class="auth-body">
    <main class="auth-card">
        <a href="/" class="brand">
            <span class="brand-logo">D</span>
            <span>Device Portal</span>
        </a>

        <p class="eyebrow">Security check</p>
        <h1>Verify your sign in</h1>
        <p class="description">Enter the six-digit code from your authenticator app to continue.</p>

        <form id="twofa-verify-form" novalidate>
            <div class="form-group">
                <label for="twofa-email">Email address</label>
                <input type="email" id="twofa-email" name="email" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="twofa-code">Authenticator code</label>
                <input type="text" id="twofa-code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" required autofocus>
            </div>

            <div id="message" class="message" role="alert"></div>
            <button type="submit" class="submit-button" id="submit-button">Verify and sign in</button>
        </form>

        <p class="footer"><a href="/signin">Back to sign in</a></p>
    </main>
</body>

</html>
