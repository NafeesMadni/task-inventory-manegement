<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
        }

        header {
            height: 70px;
            padding: 0 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }

        .logo {
            font-size: 21px;
            font-weight: 700;
            color: #2563eb;
            text-decoration: none;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-outline {
            color: #334155;
            border: 1px solid #cbd5e1;
        }

        .btn-outline:hover {
            background: #f1f5f9;
        }

        .btn-primary {
            color: white;
            background: #2563eb;
            border: 1px solid #2563eb;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        main {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .hero h1 {
            font-size: clamp(30px, 5vw, 46px);
            margin-bottom: 15px;
        }

        .hero p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.7;
        }
    </style>
</head>

<body>
    <header>
        <a href="/" class="logo">Inventory Manager</a>

        <nav id="navigation">
            <a href="/signin" class="btn btn-outline">Sign In</a>
            <a href="/signup" class="btn btn-primary">Sign Up</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Manage Your Inventory Easily</h1>
            <p>
                A simple platform to manage devices, track requests,
                and streamline inventory operations.
            </p>
        </section>
    </main>

    <script>
        async function initializeNavigation() {
            const navigation = document.getElementById("navigation");

            try {
                const response = await fetch("/api/v1/user/me", {
                    method: "GET",
                    credentials: "include"
                });

                if (response.ok) {
                    navigation.innerHTML = `
                        <a href="dashboard"
                           class="btn btn-primary">
                            Dashboard
                        </a>
                    `;
                }
            } catch (error) {
                console.error("Unable to verify authentication:", error);
            }
        }

        initializeNavigation();
    </script>
</body>

</html>
