<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Device Portal</title>
    <link rel="stylesheet" href="/static/css/app.css?v=20261116b">
    <script src="/static/js/auth.js" defer></script>

    <!-- Load the Cloudflare Turnstile script -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body class="auth-body" data-auth-page="signup">

    <main class="auth-card wide">

        <a href="/" class="brand">
            <span class="brand-logo">D</span>
            <span>Device Portal</span>
        </a>

        <p class="eyebrow">Get started</p>
        <h1>Create your account</h1>

        <p class="description">
            Create an account first. You'll request your role and access in the next step.
        </p>

        <a href="/api/v1/user/google-login" class="google-btn">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335"
                    d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                <path fill="#4285F4"
                    d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                <path fill="#FBBC05"
                    d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                <path fill="#34A853"
                    d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
            </svg>
            Continue with Google
        </a>

        <div class="divider"><span>or</span></div>

        <form id="signupForm">

            <div class="form-row">

                <div class="form-group">
                    <label for="firstName">First name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="First name" minlength="3"
                        maxlength="100" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Last name" minlength="3"
                        maxlength="100" required>
                </div>

            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" minlength="3"
                    maxlength="100" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="At least 8 characters"
                        minlength="8" autocomplete="new-password" required>

                    <button type="button" class="toggle-password" data-password-toggle="password">
                        Show
                    </button>
                </div>
            </div>

            <!-- Turnstile widget automatically injects a hidden 'cf-turnstile-response' input -->

            <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}"></div>

            <div id="message" class="message" role="alert"></div>

            <button type="submit" class="submit-button" id="submitButton">
                Create account
            </button>

        </form>

        <p class="footer">
            Already have an account?
            <a href="/signin">Sign in</a>
        </p>

    </main>

</body>

</html>
