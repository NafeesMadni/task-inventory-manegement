<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Device Portal</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/auth.js" defer></script>
</head>

<body class="auth-body" data-auth-page="login">

    <main class="auth-card">

        <a href="/" class="brand">
            <span class="brand-logo">D</span>
            <span>Device Portal</span>
        </a>

        <p class="eyebrow">Welcome back</p>
        <h1>Sign in to your account</h1>

        <p class="description">
            Enter your credentials to access your organization's device workspace.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@company.com" autocomplete="username"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password"
                        autocomplete="current-password" required>

                    <button type="button" class="toggle-password" data-password-toggle="password">
                        Show
                    </button>
                </div>
            </div>

            <div id="message" class="message" role="alert"></div>

            <button type="submit" class="submit-button" id="submitButton">
                Sign in
            </button>

        </form>

        <p class="footer">
            Don't have an account?
            <a href="/signup">Create an account</a>
        </p>

    </main>

</body>

</html>
